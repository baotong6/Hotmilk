name: Send Hotmilk Group Update

on:
  workflow_dispatch:
    inputs:
      module:
        description: "Which module was updated?"
        required: true
        type: choice
        options:
          - General
          - Server Manual
          - Data Guide
          - Storage Policy
          - Software Environments
          - Troubleshooting

      subject:
        description: "Email subject"
        required: true
        type: string

      update_file:
        description: "File containing the email content"
        required: true
        default: "updates/latest.md"
        type: string

      confirm_send:
        description: "Type SEND to confirm"
        required: true
        type: string

permissions:
  contents: read

jobs:
  send-email:
    if: ${{ inputs.confirm_send == 'SEND' }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Send update email
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}

          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}

          UPDATE_MODULE: ${{ inputs.module }}
          UPDATE_SUBJECT: ${{ inputs.subject }}
          UPDATE_FILE: ${{ inputs.update_file }}

          REPOSITORY_URL: https://github.com/${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}

        run: python .github/scripts/send_update.py
